<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students · Student Attendance Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="mobile-topbar">
    <button id="mobile-menu-toggle" aria-label="Open navigation menu">☰</button>
    <span>Attendance System</span>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">SA</div>
        <div class="sidebar-brand-text">
          Student Attendance
          <small>Management System</small>
        </div>
      </div>
      <ul class="sidebar-nav">
        <li><a href="index.html"><span class="nav-icon">▦</span> Dashboard</a></li>
        <li><a href="students.html"><span class="nav-icon">☺</span> Students</a></li>
        <li><a href="attendance.html"><span class="nav-icon">✓</span> Attendance</a></li>
        <li><a href="history.html"><span class="nav-icon">◷</span> Attendance History</a></li>
      </ul>
      <div class="sidebar-footer">SIWES Final Project</div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Students</h1>
          <p>Add, search, edit, and remove student records.</p>
        </div>
        <button class="btn btn-primary" id="add-student-btn">+ Add Student</button>
      </header>

      <div class="search-field" style="margin-bottom: 16px;">
        <input type="text" id="student-search" placeholder="Search by ID, name, or class" />
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Gender</th>
              <th>Class</th>
              <th>Age</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="students-table-body"></tbody>
        </table>
        <p class="empty-state" id="students-empty-state" hidden></p>
      </div>
    </main>
  </div>

  <!-- Add / Edit Student modal -->
  <div class="modal-overlay" id="student-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="student-modal-title">
      <div class="modal-header">
        <h2 id="student-modal-title">Add Student</h2>
        <button class="modal-close" id="student-modal-cancel" aria-label="Close">×</button>
      </div>

      <form id="student-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="field-studentId">Student ID</label>
            <input type="text" id="field-studentId" placeholder="e.g. STU-1024" />
            <span class="form-error" id="error-studentId"></span>
          </div>
          <div class="form-group">
            <label for="field-fullName">Full Name</label>
            <input type="text" id="field-fullName" placeholder="e.g. Amaka Obi" />
            <span class="form-error" id="error-fullName"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-gender">Gender</label>
            <select id="field-gender">
              <option value="">Select gender</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
            </select>
            <span class="form-error" id="error-gender"></span>
          </div>
          <div class="form-group">
            <label for="field-age">Age</label>
            <input type="number" id="field-age" min="3" max="100" placeholder="e.g. 14" />
            <span class="form-error" id="error-age"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-class">Class</label>
            <input type="text" id="field-class" list="class-options" placeholder="e.g. JSS 2B" />
            <datalist id="class-options"></datalist>
            <span class="form-error" id="error-class"></span>
          </div>
          <div class="form-group">
            <label for="field-phone">Phone Number <span class="optional-tag">(optional)</span></label>
            <input type="tel" id="field-phone" placeholder="e.g. 08012345678" />
            <span class="form-error" id="error-phone"></span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="student-modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Student</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared confirm dialog (used for delete confirmations) -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-message">
      <p id="confirm-modal-message" style="margin: 0 0 20px; font-size: 14.5px;"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirm-modal-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-modal-confirm">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/students.js"></script>
  <script>
    // The header close (×) button and the Cancel button both close the modal.
    document.getElementById("student-modal-cancel-btn").addEventListener("click", () => {
      document.getElementById("student-modal-cancel").click();
    });
  </script>
</body>
</html>
